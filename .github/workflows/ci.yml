name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tier 1: engine correctness + the safety-critical assertions. Deterministic,
  # fast, free (DuckDB is the test engine). The merge gate.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # Never the runner's system Python. The sync below names it too, and
          # the packaging tests pin their isolated wheel installs to whatever
          # interpreter runs the suite, so every step tests this version.
          python-version: ${{ matrix.python-version }}
      # The cloud extras are included so their unit tests and safety families
      # run here (they are offline against fake clients, but they importorskip
      # on the client libraries; without the extras they would silently skip).
      # --locked: a lock that no longer matches pyproject.toml fails here
      # rather than being silently re-resolved into something nobody reviewed.
      - name: Sync (duckdb + bigquery + snowflake + databricks + postgres + redshift + clickhouse + trino + dev extras)
        run: uv sync --locked --extra duckdb --extra bigquery --extra snowflake --extra databricks --extra postgres --extra redshift --extra clickhouse --extra trino --extra dev --python ${{ matrix.python-version }}
      - name: Interpreter and stack under test
        run: uv run --no-sync python -c "import sys, dbt.version, duckdb, sqlglot, certifi; print(sys.version); print('dbt-core', dbt.version.__version__, 'duckdb', duckdb.__version__, 'sqlglot', sqlglot.__version__, 'certifi', certifi.__version__)"
      - name: Tier-1 unit tests
        run: uv run --no-sync pytest -q

  # The optional capabilities the tests job does not sync: MetricFlow (the local
  # semantic backend and semantic authoring's schema validation), SLayer,
  # clustering, Ossie and the hosted backend's client, all through [all]. On
  # every supported interpreter, because these are exactly the dependencies
  # that break on a new Python first (#795: dbt and Mashumaro on 3.14). The
  # import step is what makes it a check: a test that importorskips an extra
  # would read a broken install as an absent one, so the step fails loudly
  # before any test can skip. This is also where the SLayer suite runs. That the
  # pinned SLayer's sqlglot floor still overlaps the [sql] ceiling is held by
  # the tests job instead, whose packaging test resolves [all] fresh from the
  # declared ranges rather than from the lock.
  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync (all + dev extras)
        run: uv sync --locked --extra all --extra dev --python ${{ matrix.python-version }}
      - name: Every optional capability imports
        run: |
          uv run --no-sync python -c "
          from metricflow.engine.metricflow_engine import MetricFlowEngine
          from metricflow_semantics.model.semantic_manifest_lookup import SemanticManifestLookup
          from exmergo_dex_core.transform.semantic import _metricflow_validators
          assert _metricflow_validators() is not None, 'MetricFlow schemas did not import'
          import slayer.core.models, sklearn, jsonschema, httpx
          from exmergo_dex_core.explore.semantic.local import LocalMetricFlowBackend
          from exmergo_dex_core.explore.semantic.hosted import HostedDbtCloudBackend
          print('every optional capability imported')
          "
      - name: Semantic, SLayer, Ossie and clustering suites with their extras installed
        run: uv run --no-sync pytest -q -rs tests/explore tests/transform tests/maintain tests/slayer_vendor tests/ossie

  # The safety spine is broken out as its own gate so a regression on a
  # safety-critical assertion is unmistakable in the checks list. Strict: an
  # unexpected pass (a placeholder going green early) is fine; a real
  # failure blocks the merge regardless of any benchmark score.
  # The interpreter is selected explicitly, never inherited from the runner's
  # system Python (ubuntu-latest moved to 3.14 underneath a stack that could not
  # import there). 3.14 is the newest supported, so it is where a regression is
  # likeliest; the tests job also runs this file on every supported version.
  safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dex-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Sync (duckdb + bigquery + snowflake + databricks + postgres + redshift + clickhouse + trino + dev extras)
        run: uv sync --locked --extra duckdb --extra bigquery --extra snowflake --extra databricks --extra postgres --extra redshift --extra clickhouse --extra trino --extra dev
      - name: Safety-critical assertions
        run: uv run pytest -q tests/test_safety_spine.py

  # `explore diagram` emits Mermaid and dex never renders it, so nothing in
  # pyproject.toml pins the syntax dialect it has to stay compatible with: the
  # contract is with a parser living in whatever tool a reader opens the diagram
  # in. This runs the renderer's own output through the real mermaid package,
  # which is the only way to hold that contract from here, and it is why there is
  # no Python mermaid dependency (every candidate is either a string builder that
  # replaces nothing, or a renderer that would POST the schema to a third-party
  # host). Advisory like upstream-deps-canaries.yml and for the same reason: it
  # tracks a moving upstream, so a Mermaid release breaking our dialect should be loud
  # without blocking a merge that changed nothing. It stays per pull request,
  # unlike that weekly canary, because the corpus it parses is our own renderer's
  # output, which a pull request can change.
  mermaid-syntax:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Installed outside the repo, and the checker is copied in beside it,
      # because Node resolves `node_modules` by walking up from the script's own
      # location. That keeps a 160MB dependency tree out of the working copy of a
      # Python repo, where nobody expects one and nothing ignores it. Pinned
      # major, floating within it, mirroring how sqlglot is bounded: a patch
      # should not be able to fail this, and moving the major should be a
      # deliberate act taken on this job's evidence.
      - name: Install the Mermaid parser outside the repo
        run: |
          mkdir -p "$RUNNER_TEMP/mermaid-canary"
          cd "$RUNNER_TEMP/mermaid-canary"
          npm install --silent mermaid@^11 jsdom@^26
          cp "$GITHUB_WORKSPACE/scripts/check_mermaid_syntax.mjs" .
      # Generated from the renderer rather than committed, so the corpus cannot
      # drift from what dex actually emits. The dump self-checks that it still
      # covers every cardinality glyph the policy can produce.
      - name: Render the fixture corpus
        run: uv run --project packages/dex-core python scripts/dump_mermaid_fixtures.py "$RUNNER_TEMP/mermaid-fixtures"
      - name: Parse every fixture with the real Mermaid parser
        run: |
          cd "$RUNNER_TEMP/mermaid-canary"
          node -e "console.log('testing mermaid', require('mermaid/package.json').version)"
          node check_mermaid_syntax.mjs "$RUNNER_TEMP/mermaid-fixtures"

  # The Tier-2 eval harness scoring core (triggering, output-quality, uplift math),
  # exercised with fake backends: deterministic, free, no model in the loop. The
  # live Claude-driven evals run on release, not here. Stdlib only, so uvx supplies
  # pytest and the harness needs no install.
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Eval scoring-core tests
        run: uvx pytest evals -q

  # On brand for Exmergo (easter egg): all shipped prose is em-dash free. That
  # includes the documentation site's own pages and its config, where the site
  # name and description live; the rest of the repo's JSON is fixtures and eval
  # data, so only docs/ JSON is scanned. The pages the site build generates (the
  # CLI reference, the changelog) are checked by the build itself.
  em-dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Repo prose must be em-dash clean
        run: |
          git ls-files '*.md' '*.mdc' '*.mdx' '*.txt' 'docs/*.json' \
            | xargs python scripts/check_no_em_dashes.py
